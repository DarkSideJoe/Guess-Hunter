name: guess_hunter
description: Jogo de adivinhação Guess Hunter / Caça-Número.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.0
  confetti: ^0.7.0
  audioplayers: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - Assets/Audio/
  fonts:
    - family: TitanOne
      fonts:
        - asset: Assets/fonts/TitanOne-Regular.ttf
